apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-operator-gateway
  namespace: agent-operator-system
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: agent-gateway.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: agent-operator-gateway
                port:
                  number: 8080
