apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-operator
  namespace: agent-operator-system
  labels:
    app: agent-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-operator
  template:
    metadata:
      labels:
        app: agent-operator
    spec:
      serviceAccountName: agent-operator
      # Pod-level security context — satisfies restricted PodSecurity and OpenShift SCC.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/nickmerrett/agent-operator:latest
          imagePullPolicy: Always
          args:
            - --metrics-bind-address=:8081
            - --health-probe-bind-address=:8082
            - --gateway-bind-address=:8080
            - --runtime-image=ghcr.io/nickmerrett/agent-runtime:latest
            - --leader-elect=true
          ports:
            - name: gateway
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8081
              protocol: TCP
            - name: healthz
              containerPort: 8082
              protocol: TCP
          # Container-level security context.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Writable scratch space needed when root filesystem is read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
