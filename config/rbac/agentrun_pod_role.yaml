# Role bound to the ServiceAccount used by AgentRun pods (agent-runtime).
# This is namespace-scoped — each namespace gets its own binding.
# Apply this in every namespace where agents will run.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runtime-role
  # namespace: <your-namespace>
rules:
  # Read all agent CRs needed during startup.
  - apiGroups: ["agent.runtime.io"]
    resources:
      - tools
      - mcpservers
      - agents
      - llmproviders
      - memoryproviders
      - agentpolicies
      - prompttemplates
    verbs: ["get", "list"]

  # ClusterPolicy is cluster-scoped — needs a separate ClusterRole (see below).

  # Read Secrets for LLM and memory credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

  # Read AgentRun CR to get configuration
  - apiGroups: ["agent.runtime.io"]
    resources: ["agentruns"]
    verbs: ["get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime
  # namespace: <your-namespace>
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runtime-rolebinding
  # namespace: <your-namespace>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runtime-role
subjects:
  - kind: ServiceAccount
    name: agent-runtime
    # namespace: <your-namespace>
---
# ClusterRole to allow reading ClusterPolicy (cluster-scoped resource).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-runtime-clusterpolicy-reader
rules:
  - apiGroups: ["agent.runtime.io"]
    resources: ["clusterpolicies"]
    verbs: ["get", "list"]
---
# Bind the ClusterPolicy reader to the agent-runtime SA.
# Replace <your-namespace> with the namespace where agents run.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-runtime-clusterpolicy-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-runtime-clusterpolicy-reader
subjects:
  - kind: ServiceAccount
    name: agent-runtime
    namespace: agent-system  # override per namespace as needed
